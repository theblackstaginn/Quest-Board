name: Quest MCP dependency verification
on:
  push:
    branches:
      - fix/plugin-reliability-20261027
    paths:
      - "mcp-server/package.json"
      - "mcp-server/server.js"
      - "mcp-server/upstream-fetch.js"
      - ".github/workflows/quest-mcp-verify.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile and install dependencies
        run: npm install --no-audit --no-fund
      - name: Run integration and unit tests
        run: npm test
      - name: Commit verified generated lockfile to PR branch
        run: |
          git add mcp-server/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock verified Quest MCP dependencies'
            git push origin HEAD:fix/plugin-reliability-20261027
          fi
