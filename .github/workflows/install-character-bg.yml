name: Install Character Background

on:
  push:
    paths:
      - "tmp/character-bg/ready.txt"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild WebP
        shell: bash
        run: |
          cat tmp/character-bg/chunk-1.txt               tmp/character-bg/chunk-2.txt               tmp/character-bg/chunk-3.txt               tmp/character-bg/chunk-4.txt             | base64 -d > character-bg-v77.webp
          echo "0cbd6ea0839cb0569874000c42c97f10866f04ca02a496b929d47a181e3fd669  character-bg-v77.webp" | sha256sum -c -
      - name: Wire Character background and bump build
        shell: bash
        run: |
          sed -i 's/character-bg-v76\.webp/character-bg-v77.webp/g' styles.css
          sed -i 's/quest-board-build" content="76"/quest-board-build" content="77"/g' index.html
          sed -i 's/styles\.css?v=76/styles.css?v=77/g' index.html
          sed -i 's/app\.js?v=76/app.js?v=77/g' index.html
          rm -rf tmp/character-bg
          rm -f character-bg-v76.webp
          rm -f .github/workflows/install-character-bg.yml
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Character page background"
          git push
